name: Update gold spot price

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      probe_drivers:
        description: 'Walk every driver candidate and log which ones this API key serves (costs ~11 credits, manual only)'
        type: boolean
        default: false

permissions:
  contents: write

# A probe run sleeps between calls to respect the 8 req/min limit, so it can
# outlast the 5-minute schedule. Let the newer run win rather than racing.
concurrency:
  group: update-spot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch spot price
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          GF_PROBE_DRIVERS: ${{ inputs.probe_drivers && '1' || '0' }}
        run: python3 fetch_spot.py

      - name: Commit and push if changed
        run: |
          git config user.name "spot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add spot.json
          git diff --staged --quiet || git commit -m "Update spot price"
          git pull --rebase --autostash origin main
          git push
